[project]
name = "litter-detection"
version = "0.1.0"
description = "Autonomous CNN training for litter segmentation"
# Pinned to 3.11: the vendored Jetson torch wheels are cp311-only (vendor/jetson-wheels).
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "mlflow>=2.13.0",
    "datasets>=2.19.0",
    "Pillow>=10.3.0",
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
    "tqdm>=4.66.0",
    "scikit-learn>=1.5.0",
    "pycocotools>=2.0.8",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
    "huggingface-hub>=0.23.0",
    "albumentations>=1.4.0",
    "opencv-python-headless>=4.10.0",
    "eclipse-zenoh>=1.9.0",
    "opencv-python>=4.13.0.92",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "opentelemetry-semantic-conventions>=0.45",
    "pydantic>=2.7.0",
    "pydantic-ai>=1.0.0",
    "python-dotenv>=1.2.2",
    "pydantic-ai>=0.0.14",
    "gradio>=5.0.0",
]
# Resolve/lock ONLY for the desktop platforms. This keeps the aarch64 Jetson
# out of the universal resolution, so a local `path` source for the Jetson
# wheels is never needed — and `uv run` / `uv lock` never touch vendor/ on a
# laptop. The Jetson (aarch64) is installed separately, see "Jetson setup" below.
[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

# Desktops (Windows AMD64 / Linux x86_64) pull torch/torchvision from the cu121
# index. On the Jetson these come from the vendored NVIDIA JetPack wheels under
# vendor/jetson-wheels — installed manually (see "Jetson setup" below), NOT via
# a path source here, so the wheels are never required off the Jetson.
[tool.uv.sources]
torch = [{ index = "pytorch", marker = "platform_machine != 'aarch64'" }]
torchvision = [{ index = "pytorch", marker = "platform_machine != 'aarch64'" }]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
cam = "litter_detection.camera.webcam:main"
interference = "litter_detection.interference.interference:main"
vis = "litter_detection.visualisation.visualiser:main"
litter-dashboard = "litter_detection.visualisation.dashboard.visualization:main"
litter-detection = "litter_detection.agent.coordinator:main"
